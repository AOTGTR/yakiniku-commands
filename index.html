<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YL Yakiniku คำสั่ง</title><link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700;800&family=Sarabun:wght@400;600&display=swap">
<style>
:root{--bg:#1a0f09;--panel:#24150d;--ink:#f6e7cf;--muted:#c9ab8d;--line:#4a3020;--gold:#d6aa5c;--red:#b3261e;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Sarabun,Kanit,system-ui,sans-serif}
main{max-width:1080px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-left)) 64px;display:grid;gap:32px}
h1,h2{font-family:Kanit,sans-serif;margin:0}h1{font-size:clamp(28px,5vw,42px)}h2{font-size:24px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}h2 small{font:400 14px Sarabun;color:var(--muted)}
.hero img{width:100%;border-radius:16px;display:block}.hero p{color:var(--muted);margin:8px 0 0}
section{display:grid;gap:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.cmd{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.clip{aspect-ratio:16/9;background:#000}.clip video{width:100%;height:100%;object-fit:cover;display:block}
figcaption{padding:12px 14px 14px;display:grid;gap:8px}figcaption p{margin:0}
.copy{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:8px 12px;border-radius:10px;border:1px solid var(--gold);background:#120a06;color:var(--ink);cursor:pointer;font:600 15px Kanit,sans-serif}
.copy code{font:700 17px ui-monospace,monospace;color:#ffd36a}.copy span{font-size:13px;color:var(--gold)}.copy.ok span{color:#6dff9a}
.gifts{display:flex;flex-wrap:wrap;gap:6px}.gift{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:99px;background:#3a2418;font-size:13px}.gift img{width:24px;height:24px}
footer{color:var(--muted);font-size:13px}
</style></head><body><main>
<header class="hero"><img src="cover.jpg" alt="YL Yakiniku"><h1>YL Yakiniku · คำสั่ง</h1>
<p>กดก๊อปคำสั่งไปใส่ในกฎของขวัญ · เลขหลังคำสั่งเปลี่ยนได้ · ป้ายของขวัญ = ของในพรีเซ็ตทางการ</p></header>
<section><h2>💥 แกล้ง = สั่งเนื้อ <small>คนส่ง = ลูกค้าเข้าร้าน สตรีมเมอร์ต้องย่างให้ครบ</small></h2><div class="grid"><figure class="cmd"><div class="clip"><video src="media/play.mp4" poster="media/play.jpg" muted loop playsinline preload="none"></video></div>
<figcaption><button class="copy" data-c="set 1"><code>set 1</code><span>ก๊อป</span></button><p>สั่งเนื้อคละ หมูสลับวัว · เลข = จำนวนชิ้น (กุหลาบ 20 อัน = หมู 10 วัว 10)</p><div class="gifts"><span class="gift"><img src="gifts/5655.webp" alt="">กุหลาบ · 1 เหรียญ</span><span class="gift">หัวใจครบ 100</span><span class="gift">กดติดตาม</span></div></figcaption></figure>
<figure class="cmd"><div class="clip"><video src="media/r_order.mp4" poster="media/r_order.jpg" muted loop playsinline preload="none"></video></div>
<figcaption><button class="copy" data-c="random order 3 14"><code>random order 3 14</code><span>ก๊อป</span></button><p>สุ่มแกล้ง: สั่งเนื้อจำนวนสุ่มระหว่าง 2 เลข (3 14 / 10 40)</p><div class="gifts"><span class="gift"><img src="gifts/5779.webp" alt="">I love you · 10 เหรียญ</span></div></figcaption></figure>
<figure class="cmd"><div class="clip"><video src="media/play.mp4" poster="media/play.jpg" muted loop playsinline preload="none"></video></div>
<figcaption><button class="copy" data-c="pork 1"><code>pork 1</code><span>ก๊อป</span></button><p>หมูสามชั้น · สุกช้า ต้องรอสุกจริง</p></figcaption></figure>
<figure class="cmd"><div class="clip"><video src="media/play.mp4" poster="media/play.jpg" muted loop playsinline preload="none"></video></div>
<figcaption><button class="copy" data-c="beef 1"><code>beef 1</code><span>ก๊อป</span></button><p>เนื้อวัว · สุกไว ต้องรีบยก</p></figcaption></figure>
<figure class="cmd"><div class="clip"><video src="media/play.mp4" poster="media/play.jpg" muted loop playsinline preload="none"></video></div>
<figcaption><button class="copy" data-c="wagyu 1"><code>wagyu 1</code><span>ก๊อป</span></button><p>วากิว · ช่วงกำลังดีสั้นสุด</p></figcaption></figure></div></section>
<section><h2>🛡️ ช่วยปิ้ง <small>ช่วยสตรีมเมอร์ให้ทัน</small></h2><div class="grid"><figure class="cmd"><div class="clip"><video src="media/staff.mp4" poster="media/staff.jpg" muted loop playsinline preload="none"></video></div>
<figcaption><button class="copy" data-c="staff 10"><code>staff 10</code><span>ก๊อป</span></button><p>พนักงานมาทำให้ทุกอย่าง ใส่เตา กลับ ยก เสิร์ฟ · เลข = วินาที (นับเฉพาะตอนมีลูกค้า)</p><div class="gifts"><span class="gift"><img src="gifts/8913.webp" alt="">โรซ่า · 10 เหรียญ</span></div></figcaption></figure>
<figure class="cmd"><div class="clip"><video src="media/r_help.mp4" poster="media/r_help.jpg" muted loop playsinline preload="none"></video></div>
<figcaption><button class="copy" data-c="random help"><code>random help</code><span>ก๊อป</span></button><p>สุ่มช่วย: พนักงาน 10 / 20 / 30 วิ · ย่างไว x2 30 วิ / 1 นาที / 2 นาที · พลิกทุกชิ้น</p><div class="gifts"><span class="gift"><img src="gifts/7934.webp" alt="">ใจส้ม · 1 เหรียญ</span><span class="gift"><img src="gifts/13000.webp" alt="">Baby Hippo · 15 เหรียญ</span></div></figcaption></figure>
<figure class="cmd"><div class="clip"><video src="media/speed.mp4" poster="media/speed.jpg" muted loop playsinline preload="none"></video></div>
<figcaption><button class="copy" data-c="slow 60"><code>slow 60</code><span>ก๊อป</span></button><p>แกล้ง: ลดเวลาย่างไว x2 ที่เหลืออยู่ · เลข = วินาที (หมดก่อนก็จบเลย)</p></figcaption></figure>
<figure class="cmd"><div class="clip"><video src="media/speed.mp4" poster="media/speed.jpg" muted loop playsinline preload="none"></video></div>
<figcaption><button class="copy" data-c="speed 600"><code>speed 600</code><span>ก๊อป</span></button><p>ย่างไว x2 เนื้อสุกไวสองเท่า · เลข = วินาที (600 = 10 นาที) · เวลาเดินตลอดแม้ไม่มีลูกค้า</p><div class="gifts"><span class="gift"><img src="gifts/6427.webp" alt="">หมวกกับหนวด · 99 เหรียญ</span></div></figcaption></figure></div></section>
<footer>YL Entertainment · เกมเนื้อย่าง YL</footer></main>
<script>
document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.c);b.classList.add('ok');b.querySelector('span').textContent='ก๊อปแล้ว';setTimeout(()=>{b.classList.remove('ok');b.querySelector('span').textContent='ก๊อป'},1500)}catch{const r=document.createRange();r.selectNodeContents(b.querySelector('code'));getSelection().removeAllRanges();getSelection().addRange(r)}});
const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;if(e.isIntersecting){v.preload='auto';v.play().catch(()=>{})}else v.pause()}),{threshold:.4});document.querySelectorAll('video').forEach(v=>io.observe(v));
</script></body></html>
